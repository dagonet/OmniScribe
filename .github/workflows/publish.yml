name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Package index to publish to"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  guard:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert tag matches pyproject version
        run: |
          PYPROJECT_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "tag=${GITHUB_REF_NAME} pyproject=${PYPROJECT_VERSION}"
            if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match pyproject.toml version ${PYPROJECT_VERSION}"
              exit 1
            fi
          else
            echo "workflow_dispatch run, pyproject version=${PYPROJECT_VERSION} (no tag to compare)"
          fi

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check distributions with twine
        run: uvx twine check --strict dist/*

      # This artifact only hands dist/ from the build job to later jobs in this
      # same run. The artifact storage quota is per-account and shared across
      # every repo, so it should not use GitHub's 90-day default. 3 days (not
      # 1) leaves a window to re-run failed jobs on a later day without the
      # artifact having expired.
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  publish-testpypi:
    needs: build
    if: github.event_name == 'push' || github.event.inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI is a rehearsal target: re-runs (tag re-push, re-run of a
          # failed run, repeat workflow_dispatch) must be idempotent, so an
          # already-published version is skipped rather than failing the run.
          # Do NOT mirror this to publish-pypi below — on the real index a
          # "file already exists" failure is a signal (e.g. a forgotten
          # version bump) that must stay loud, not be silently skipped.
          skip-existing: true

  publish-pypi:
    needs: [build, publish-testpypi]
    # publish-testpypi is intentionally skipped on this trigger path (target=pypi
    # dispatch), and GitHub's implicit `needs` gate treats a skipped dependency as
    # blocking unless overridden with `always()`. Without it this job is
    # unreachable by any input combination.
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target == 'pypi' &&
      needs.build.result == 'success' &&
      (needs.publish-testpypi.result == 'success' || needs.publish-testpypi.result == 'skipped')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  create-release:
    # Only the real-PyPI publish should produce a GitHub Release: a bare tag
    # push (and a target=testpypi dispatch) only reach TestPyPI, a rehearsal
    # target that re-runs freely (skip-existing: true) -- creating a Release
    # for every rehearsal would misrepresent what's actually installable from
    # PyPI. publish-pypi only succeeds on an explicit target=pypi dispatch, so
    # gating on its result is equivalent to gating on "a real publish happened".
    needs: [guard, publish-pypi]
    # `always()` is required here, not optional decoration: publish-pypi is
    # itself skipped on the tag-push and target=testpypi dispatch paths, and a
    # bare `if:` with no status-check function has GitHub implicitly AND in
    # `success()` -- which inherits that upstream skip and silently skips this
    # job too, even though the explicit `needs.publish-pypi.result` check
    # below is written correctly. Without always() this job is unreachable on
    # every trigger (confirmed: skipped on the v0.5.0 real-PyPI publish run
    # 33121933713 despite publish-pypi succeeding).
    if: |
      always() &&
      needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=${VERSION}" >> "$GITHUB_ENV"
          # Prefix comparison instead of a dynamic regex: interpolating "[" and
          # "]" into a $0 ~ (...) pattern is escape-sensitive across awk
          # implementations (verified to silently produce an empty match on at
          # least one), so match the literal header prefix as a plain string.
          PAT="## [${VERSION}]"
          awk -v pat="$PAT" '
            substr($0, 1, length(pat)) == pat { found=1; next }
            found && substr($0, 1, 4) == "## [" { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version ${VERSION} -- update CHANGELOG.md before publishing."
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${version}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists -- updating notes instead of failing."
            gh release edit "$TAG" --title "$TAG" --notes-file release_notes.md --draft=false
          else
            # guard's tag/version check only runs on tag-push triggers ("no tag
            # to compare" on dispatch), so nothing guarantees vX.Y.Z exists yet
            # on a workflow_dispatch run. --target is ignored by the API when
            # the tag already exists, and used as the tag's commit only when
            # gh has to create it -- pin it to this run's commit either way.
            gh release create "$TAG" --title "$TAG" --notes-file release_notes.md --target "$GITHUB_SHA"
          fi

  publish-status:
    # Runs regardless of upstream outcome so a target=pypi dispatch that
    # publishes nothing is reported as a failed run instead of a false green
    # (see run 33114254809: all publish jobs skipped, workflow still "success").
    needs: [build, publish-testpypi, publish-pypi, create-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify a requested PyPI publish actually happened
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.target }}" = "pypi" ]; then
            if [ "${{ needs.publish-pypi.result }}" != "success" ]; then
              echo "::error::target=pypi was requested but publish-pypi did not succeed (result=${{ needs.publish-pypi.result }}). Nothing was published to PyPI."
              exit 1
            fi
            echo "Published to PyPI successfully."
            # A real publish without a Release is exactly the bug this job
            # exists to catch (create-release silently skipped despite
            # publish-pypi succeeding, run 33121933713) -- fail loudly instead
            # of relying on someone to notice a missing Release by hand.
            if [ "${{ needs.create-release.result }}" != "success" ]; then
              echo "::error::publish-pypi succeeded but create-release did not (result=${{ needs.create-release.result }}). No GitHub Release was created for this publish."
              exit 1
            fi
            echo "GitHub Release created successfully."
          else
            echo "No PyPI publish requested on this trigger (event=${{ github.event_name }}, target=${{ github.event.inputs.target }})."
          fi
